version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pipeline-net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - pipeline-net

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    networks:
      - pipeline-net

  market-generator:
    build: ./market-generator
    environment:
      - KAFKA_BROKER=kafka:29092
      - TOPIC=market-ticks
    depends_on:
      - kafka
    networks:
      - pipeline-net

  ingestion-service:
    build: ./ingestion-service
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKER=kafka:29092
      - IN_TOPIC=market-ticks
      - OUT_TOPIC=normalized-ticks
    depends_on:
      - kafka
    networks:
      - pipeline-net

  feature-service:
    build: ./feature-service
    environment:
      - KAFKA_BROKER=kafka:29092
      - IN_TOPIC=normalized-ticks
      - OUT_TOPIC=ml-features
    depends_on:
      - kafka
    networks:
      - pipeline-net

  inference-service:
    build: ./inference-service
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BROKER=kafka:29092
      - IN_TOPIC=ml-features
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - kafka
      - redis
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge
